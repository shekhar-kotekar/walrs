apiVersion: v1
kind: Namespace
metadata:
  name: ${PROJECT_NAME}
  labels:
    name: kraft-rs
---
apiVersion: v1
kind: Service
metadata:
  name: walrs-service
  namespace: ${PROJECT_NAME}
  labels:
    app: kraftrs
spec:
  clusterIP: None
  selector:
    app: kraftrs
  ports:
  - protocol: UDP
    port: 5056
    targetPort: 5056
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: walrs-local-pv
  namespace: ${PROJECT_NAME}
  labels:
    app: kraftrs
    type: local
spec:
  capacity:
    storage: 256Mi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /tmp/walrs/
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - kind-worker
