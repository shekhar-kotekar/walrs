[package]
name = "commons"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "2.0.1"
bytes = { version = "1.10.1", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.45.1", features = ["full"] }
tokio-util = { version = "0.7.15", features = ["codec", "rt"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = "0.3.19"

[dev-dependencies]
tracing-test = "0.2.5"
