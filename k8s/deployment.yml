apiVersion: apps/v1
kind: Deployment
metadata:
  name: kraft-rs-broker
  namespace: kraft-rs
  labels:
    app: kraftrs
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kraftrs
  template:
    metadata:
      labels:
        app: kraftrs
        role: broker
    spec:
      containers:
      - name: kraftrs
        image: localhost:5001/kraft_rs:latest
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 5056
        resources:
          requests:
            memory: "32Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
