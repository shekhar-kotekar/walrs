[package]
name = "kraft_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.216", features = ["derive"] }
bincode = "1.3.3"
chrono = "0.4.39"
rand = "0.8.5"
tokio = { version = "1.42.0", features = ["full"] }
tokio-util = { version = "0.7.13", features = ["codec", "rt"] }
toml = "0.8.19"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
uuid = { version = "1.11.0", features = ["v4", "serde"] }

[dev-dependencies]
tracing-test = "0.2.5"
