[package]
name = "server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "walrs_server"
path = "src/main.rs"

[dependencies]
console-subscriber = "0.4.1"
common = { path = "../common" }
serde = { version = "1.0.216", features = ["derive"] }
serde_yml = "0.0.12"
bincode = "1.3.3"
tokio = { version = "1.42.0", features = ["full", "tracing"] }
tokio-util = { version = "0.7.13", features = ["codec", "rt"] }
toml = "0.8.19"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tracing-appender = "0.2.3"
chrono = "0.4.41"


[dev-dependencies]
tracing-test = "0.2.5"
tempdir = "0.3.7"
