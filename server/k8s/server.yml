apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: walrs-srvr
  namespace: walrs
  labels:
    app: walrs-srvr
spec:
  serviceName: walrs-headless-service
  replicas: 3
  selector:
    matchLabels:
      app: walrs-srvr
  template:
    metadata:
      labels:
        app: walrs-srvr
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: walrs-server
          image: localhost:5001/walrs:${GIT_COMMIT}
          ports:
            - containerPort: 5056
              name: walrs-srvr-svc
            - containerPort: 8000
              name: metrics
          resources:
            requests:
              memory: "32Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SERVICE_NAME
              value: "walrs-headless-service"
            - name: CLUSTER_DOMAIN
              value: "cluster.local"
            - name: REPLICA_COUNT
              value: "3"
            - name: POD_NAME_PREFIX
              value: "walrs-srvr"
---
kind: Service
apiVersion: v1
metadata:
  name: walrs-headless-service
  namespace: walrs
spec:
  clusterIP: None
  ports:
    - name: tcp
      protocol: TCP
      port: 5056
      targetPort: walrs-srvr-svc
  selector:
    app: walrs-srvr
