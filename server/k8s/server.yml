apiVersion: apps/v1
kind: Deployment
metadata:
  name: walrs-server
  namespace: walrs
  labels:
    app: walrs-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: walrs-server
  template:
    metadata:
      labels:
        app: walrs-server
    spec:
      containers:
      - name: walrs-server
        image: localhost:5001/walrs_server:latest
        ports:
        - containerPort: 8080
          name: walrs-server-svc
        resources:
          requests:
            memory: "32Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: walrs-server-service
  namespace: walrs
spec:
  type: NodePort
  ports:
  - protocol: TCP
    port: 8080
    nodePort: 30002
    targetPort: walrs-server-svc
  selector:
    app: walrs-server