kind: Pod
apiVersion: v1
metadata:
  name: ubuntu-debug-pod
  namespace: walrs
  labels:
    app: ubuntu-debug
spec:
  containers:
    - image: ubuntu:latest
      command:
        - "sleep"
        - "3600"
      imagePullPolicy: IfNotPresent
      name: ubuntu-debug
      resources:
        requests:
          memory: "32Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"
